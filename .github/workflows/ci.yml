name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Lint with ruff
        run: ruff check .
      - name: Type check with mypy
        run: mypy behavioral/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=behavioral --cov=environment --cov=experiments

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run stress benchmark
        run: |
          PYTHONPATH=. python experiments/stress_benchmark.py --output results/stress_benchmark.json --seeds "42"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: stress-benchmark
          path: results/stress_benchmark.json

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Phase 4 (1 seed)
        run: |
          PYTHONPATH=. python -m experiments.run --experiment phase4 --seeds 1 --summarize
      - name: Verify results
        run: |
          python -c "import json; d=json.load(open('results/phase4_main.json')); print('Seeds:', len(d)); print('Heldout acc:', d[0]['results']['full_bp']['heldout_acc'])"
