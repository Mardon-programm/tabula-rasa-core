# Main Hydra configuration for TR-Core experiments
defaults:
  - experiment: phase4
  - agent: behavioral_program_v3
  - env: attribute_tasks_v4
  - _self_

# Global settings
seed: 42
device: cpu
output_dir: ${hydra:runtime.output_dir}
results_dir: results

# Hydra runtime
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.id}
  job:
    chdir: true