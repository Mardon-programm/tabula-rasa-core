# Phase 4 Experiment Configuration
name: phase4
description: "Structural-OOD composition generalization"

# Experiment parameters
n_seeds: 24
seed_base: 7000
replication_base: 17000

# Data splits (V4)
train_size: 600
known_size: 200
heldout_test_size: 60
row_test_size: 200

# Agent configuration
agent:
  develop_interval: 250
  min_coverage: 4
  validate_accuracy: 0.85
  validate_margin: 0.05
  explore_rate: 0.0  # No exploration during eval
  max_arity: 4
  max_rules_per_action: 40
  min_hits: 5
  theta: 0.95
  alpha: 1e-3

# Baseline configurations
baselines:
  - name: ValueKNN
    k: 15
  - name: ValueMultiDecisionList
    max_arity: 4
    min_coverage: 8
    ratio: 0.85
  - name: ValueDecisionTree
    max_depth: 10
    min_samples_leaf: 8
  - name: ValueRandomForest
    n_estimators: 25
    max_depth: 10
    min_samples_leaf: 8
    max_features: 6

# Ablation configurations
ablations:
  - name: null_bp
    randomize_outcomes: true
  - name: ab_no_compose
    allowed_operations: ["CREATE", "MODIFY", "GENERALIZE", "SPECIALIZE", "SPLIT", "DELETE"]

# Metrics
metrics:
  - heldout_accuracy
  - row_balanced_accuracy
  - row_overall_accuracy
  - known_accuracy
  - pair_rule_recovery
  - heldout_region_coverage

# Statistical testing
statistics:
  permutation_tests: 20000
  alpha: 0.05

# Output
save_predictions: true
save_rules: true
save_audit: true